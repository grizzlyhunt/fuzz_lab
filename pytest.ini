[pytest]
testpaths = tests

# Put the project root on sys.path so tests can `import run_fuzzer`, and tests/ so they
# can import the shared ASan-report builders. Doing it here avoids needing a conftest.py
# at the repository root purely for its sys.path side effect -- which would also collide
# with tests/conftest.py, since two conftest modules in non-package directories fight
# over the same "conftest" module name.
pythonpath = . tests

# Coverage is measured on every run rather than behind an opt-in flag: the point of the
# suite is to keep an eye on how much of the project is actually exercised, and a number
# that only appears when someone remembers to ask for it stops being watched.
# term-missing lists the uncovered line numbers, so a drop is immediately actionable.
addopts = --cov --cov-report=term-missing
